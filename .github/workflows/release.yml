name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Swift version
        run: swift --version

      - name: Validate tag and release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          plist_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          test "$version" = "$plist_version"
          grep -Fq "# XDVPN v${version}" RELEASE_NOTES.md
          awk '
            /^## 更新了什么[[:space:]]*$/ { in_updates = 1; next }
            in_updates && /^## / { exit }
            in_updates && NF { found = 1; exit }
            END { exit !found }
          ' RELEASE_NOTES.md

      - name: Install OpenConnect and ocproxy for bundling
        run: |
          brew update
          brew install openconnect ocproxy

      - name: Build release zip
        run: ./build.sh release

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: XDVPN ${{ github.ref_name }}
          files: build/XDVPN-v${{ steps.ver.outputs.version }}.zip
          body_path: RELEASE_NOTES.md
