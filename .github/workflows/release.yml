name: Release

# 打 tag 时构建并发布；PR 上只跑到打包为止，发版流程坏了能在合入前发现。
on:
  push:
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Swift version
        run: swift --version

      - name: Validate tag and release notes
        if: github.event_name == 'push'
        run: |
          version="${GITHUB_REF_NAME#v}"
          plist_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          test "$version" = "$plist_version"
          grep -Fq "# XDVPN v${version}" RELEASE_NOTES.md
          awk '
            /^## 更新了什么[[:space:]]*$/ { in_updates = 1; next }
            in_updates && /^## / { exit }
            in_updates && NF { found = 1; exit }
            END { exit !found }
          ' RELEASE_NOTES.md

      - name: Test
        run: swift test

      - name: Fetch OpenConnect runtime for bundling
        run: scripts/fetch-prebuilt-runtime.sh "$RUNNER_TEMP/openconnect-runtime"

      - name: Build release zip
        run: XDVPN_PREBUILT_RUNTIME_DIR="$RUNNER_TEMP/openconnect-runtime" ./build.sh release

      - name: Extract version from tag
        if: github.event_name == 'push'
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: XDVPN ${{ github.ref_name }}
          files: build/XDVPN-v${{ steps.ver.outputs.version }}.zip
          body_path: RELEASE_NOTES.md
